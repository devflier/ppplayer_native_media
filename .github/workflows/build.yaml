name: Validate ppplayer Android native media
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install host build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake libtool pkg-config meson ninja-build nasm cmake unzip python3
      - name: Fetch pinned sources and tools
        run: bash scripts/bootstrap_android.sh
      - name: Test actual EGL context function
        run: python3 scripts/test_egl_fallback.py
      - name: Build and package emulator library
        run: |
          PPPLAYER_BUILD_JOBS=2 bash scripts/build_android.sh x86_64
          python3 scripts/package_android.py --abi x86_64
      - name: Build and package device library
        run: |
          PPPLAYER_BUILD_JOBS=2 bash scripts/build_android.sh arm64
          python3 scripts/package_android.py --abi arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: ppplayer-android-native-candidate
          path: |
            artifacts/ppplayer-*.jar
            artifacts/manifest.json
            sources.lock.json
            buildscripts/patches/
          if-no-files-found: error
