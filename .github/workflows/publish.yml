name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.3'
      - name: Check release version
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          text = pathlib.Path('packages/media_kit_libs_android_video/pubspec.yaml').read_text()
          version = re.search(r'^version:\s*(\S+)', text, re.M).group(1)
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Tag and package version must match'
          PY
      - name: Prepare and verify corresponding sources and release binaries
        run: |
          python3 scripts/prepare_pub_package.py
          python3 scripts/prepare_pub_package.py --verify-only
      - name: Install dependencies
        working-directory: packages/media_kit_libs_android_video
        run: flutter pub get
      - name: Validate package contents
        working-directory: packages/media_kit_libs_android_video
        run: dart pub publish --dry-run
      - name: Build Android consumer example
        working-directory: packages/media_kit_libs_android_video/example
        run: |
          flutter pub get
          flutter analyze
          flutter build apk --debug --target-platform android-arm64,android-x64
      - name: Verify libraries shipped in consumer APK
        run: python3 scripts/verify_apk.py packages/media_kit_libs_android_video/example/build/app/outputs/flutter-apk/app-debug.apk --package packages/media_kit_libs_android_video
      - name: Publish package
        working-directory: packages/media_kit_libs_android_video
        run: dart pub publish --force
